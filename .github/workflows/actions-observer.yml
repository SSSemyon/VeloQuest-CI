name: Actions observer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/run-actions-observer

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" \
            --jq '{observed_at: now | todate, workflow_runs: [.workflow_runs[] | {id, name, event, status, conclusion, head_sha, run_number, run_attempt, created_at, updated_at, html_url}]}' \
            > .github/actions-observer.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/actions-observer.json
          git commit -m 'ci: snapshot public Actions status'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
