name: Garage strict snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/garage-strict-snapshot.yml

permissions:
  contents: write

concurrency:
  group: veloquest-garage-strict-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current public Garage snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild strict enrichment queue
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-garage-catalog.mjs --strict-core --write-enrichment-queue=catalog-harvester/enrichment-queue.json > /tmp/catalog-audit.json
          node scripts/apply-garage-outcomes-to-enrichment-queue.mjs catalog-harvester/enrichment-queue.json

      - name: Capture exact 718 gate snapshot
        shell: bash
        run: |
          set +e
          node scripts/check-garage-maximum.mjs > .github/garage-maximum-snapshot.json 2> .github/garage-maximum-stderr.txt
          status=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          q = json.loads(Path('catalog-harvester/enrichment-queue.json').read_text())
          compact = {
              'catalog_models': q.get('catalog_models'),
              'current': q.get('current'),
              'shortfall_to_718': {
                  k: max(0, int(q.get('catalog_models', 0)) - int(v or 0))
                  for k, v in (q.get('current') or {}).items()
              },
              'work_cohort_counts': {
                  k: len(v) if isinstance(v, list) else None
                  for k, v in (q.get('work_cohorts') or {}).items()
              },
              'work_cohorts': q.get('work_cohorts') or {},
          }
          Path('.github/garage-gap-snapshot.json').write_text(json.dumps(compact, indent=2, ensure_ascii=False) + '\n')
          PY
          printf '%s\n' "$status" > .github/garage-maximum-exit-code
          cat .github/garage-maximum-snapshot.json
          cat .github/garage-gap-snapshot.json

      - name: Persist strict snapshot
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-harvester/enrichment-queue.json .github/garage-maximum-snapshot.json .github/garage-maximum-stderr.txt .github/garage-gap-snapshot.json .github/garage-maximum-exit-code
          if git diff --cached --quiet; then
            echo 'Strict Garage snapshot unchanged.'
            exit 0
          fi
          git commit -m 'ci: persist strict Garage 718 snapshot'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
