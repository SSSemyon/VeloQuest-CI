name: TDD Garage model update parser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tdd-garage-model-update-parser.yml

permissions:
  contents: write

jobs:
  test-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public CI repository
        uses: actions/checkout@v4
        with:
          path: public

      - name: Checkout exact private GREEN checkpoint
        uses: actions/checkout@v4
        with:
          repository: SSSemyon/VeloQuest
          ref: 9d203c3daf03052c0cc2332e1ca9020626414d34
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Run parser and audit-wiring regressions
        id: parser
        continue-on-error: true
        working-directory: source
        run: node --test tests/garage-model-update-parser.test.mjs tests/garage-audit-model-update-order-expansion.test.mjs

      - name: Record TDD outcome
        working-directory: public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.parser.outcome }}
        run: |
          set -euo pipefail
          printf 'source_sha=%s\noutcome=%s\nrun_id=%s\n' '9d203c3daf03052c0cc2332e1ca9020626414d34' "$TEST_OUTCOME" "$GITHUB_RUN_ID" > .github/garage-parser-tdd-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/garage-parser-tdd-status
          git commit -m "ci: record Garage parser TDD ${TEST_OUTCOME}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
          test "$TEST_OUTCOME" = success
