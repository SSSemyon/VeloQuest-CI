name: Actions ping

on:
  push:
    branches:
      - main
    paths:
      - .github/run-actions-ping

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record GitHub-hosted runner availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "runner=ubuntu-latest" > .github/actions-ping-result
          echo "run_id=${GITHUB_RUN_ID}" >> .github/actions-ping-result
          echo "sha=${GITHUB_SHA}" >> .github/actions-ping-result
          git add .github/actions-ping-result
          git commit -m 'ci: confirm public GitHub-hosted runner'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
